version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dugoutai-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DATABASE_URL=sqlite:////app/data/dugoutai.db
      - FRONTEND_ORIGIN=http://localhost:5173,http://localhost:3000,http://localhost:80
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - dugoutai_db_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dugoutai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dugoutai_db_data:
    name: dugoutai_db_data

